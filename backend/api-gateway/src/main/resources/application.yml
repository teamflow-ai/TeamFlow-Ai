server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:

          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/employees/**,/api/v1/departments/**,/api/v1/teams/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/leaves/**,/api/v1/reports/departments/**
            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/api/v1/projects/**,/api/v1/sprints/**,/api/v1/tasks/**,/api/v1/meetings/**,/api/v1/worklogs/**,/api/v1/bugs/**,/api/v1/clients/**,/api/v1/search/**,/api/v1/approvals/**,/api/v1/milestones/**,/api/v1/reports/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/ai/**,/api/v1/dashboard/**,/api/v1/analytics/**,/api/v1/notifications/**
          discovery:
            locator:
              enabled: false

teamflow:
  jwt:
    secret: ${TEAMFLOW_JWT_SECRET:4Fv8Qn7LpX2mRs9ZaB6KdE1WtY5UhJ3NcP8GxL0VmR2QaF7S}
    issuer: teamflow.ai
  cors:
    allowed-origins: ${TEAMFLOW_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
